ext {
    ASSET_DIR = "${projectDir}/src/main/assets"
}

tasks.register("downloadYoloModel", Download) {
    src("https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.onnx")
    dest("${ASSET_DIR}/yolo26n.onnx")
    overwrite(false)
}

tasks.named("preBuild").configure {
    dependsOn("downloadYoloModel")
}
